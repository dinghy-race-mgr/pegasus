; system identification

sys_name      = raceManager                                 ; name of system
sys_release   = Pegasus                                     ; release name
sys_version   = v11.3                                      ; code version
sys_copyright = "Elmswood Software"                         ; copyright
sys_website   = "http://dinghyracemanager.wordpress.com/"   ; web site

; database connection
db_host = syc-mysqldb80                                ; racemanager database server
db_user = rmuser                                   ; racemanager database user
db_pass = mypass01                                  ; racemanager database user password
db_port = 3306                                     ; racemanager database port
db_name = pegasus_stx                              ; racemanager database name

; dutyman connection
dtm_host = dutyman                                 ; dutyman database server
dtm_user = S12345676                                ; dutyman database user
dtm_pass = xxxxxxxxx                            ; dutyman database user password
dtm_port = 3307                                    ; dutyman database port
dtm_name = dutyman.biz                             ; dutyman database name

; locations
baseurl = "http://localhost/pegasus"               ; url path to raceManager
basepath = "C://xampp/htdocs/pegasus"              ; disk path to raceManager

; system environment
sys_type = dev                                     ; system type                    (live|dev)

; language (future use)
;language = en                                     ; language file                  (default = en)

; timezone
timezone = Europe/London                           ; timezone                       (default = Europe/London)

; results stores
result_upload = "all"                                              ; control of upload of results to website  ( none|all )
result_url = http://localhost/pegasus/results                      ; url to local results folder [for OOD access]
result_path = C:/xampp/htdocs/pegasus/results                      ; path to local results folder  (default)
result_public_url = https://www.starcrossyc.org.uk/syc_results     ; url to website results folder  (default)
result_public_path = /syc_testtransfer                             ; path to website results folder (default)
result_transfer_protocol = "sftp"                                  ; file transfer protocol from local to website (network|sftp)

;email                                                             ; FIXME - EMAIL NEEDS TO BE MODIFIED FOR BREVO
email_enabled = on                                                 ; messages will be sent to addresses in email list ( on|off )
email_list = "a@blueyonder.co.uk, b@keemail.me"
email_host = "ssl://smtp.gmail.com"
email_port = "465"
email_user = "starcrossyc.rm@gmail.com"
email_pwd  = "xxxxxxx"

; ftp configuration
ftp_protocol = sftp                                 ; transfer protocol (ftp or sftp)
ftp_server = "128.140.109.254"                      ; ftp/sftp server name
ftp_user = "sftp_racemanager"                       ; ftp/sftp account user name
ftp_pwd = "xxxxx"                              ; ftp/sftp account password

